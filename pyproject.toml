[project]
name = "fractals"
version = "0.1.0"
description = "Fractal generator with Python + Rust core"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "maturin>=1.0",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
